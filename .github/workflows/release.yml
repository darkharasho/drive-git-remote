name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      # A release should not ship something the test suite has not seen.
      - name: Test
        run: go test ./... -timeout 10m

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          LDFLAGS="-s -w -X github.com/darkharasho/drive-git-remote/internal/cli.Version=${VERSION}"
          mkdir -p dist

          while read -r goos goarch; do
            name="drive-git"
            [ "$goos" = "windows" ] && name="drive-git.exe"
            workdir="$(mktemp -d)"

            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "$LDFLAGS" -o "$workdir/$name" ./cmd/drive-git
            cp README.md "$workdir/"

            base="drive-git_${VERSION}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$workdir" && zip -q -r "$base.zip" .)
              mv "$workdir/$base.zip" dist/
            else
              tar -czf "dist/$base.tar.gz" -C "$workdir" "$name" README.md
            fi
            echo "built $base"
          done <<'TARGETS'
          darwin arm64
          darwin amd64
          linux amd64
          linux arm64
          windows amd64
          TARGETS

          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          sed "s/__VERSION__/${VERSION}/g" .github/release-notes.md > notes.md
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
